name: CI

# Test/lint gate on every push and PR - distinct from DEPLOYMENT.md's documented (and not yet
# implemented) deploy.yml example, which builds/ships to a production server that doesn't exist
# yet. This workflow only needs to exist to run what's actually here: the backend's real Jest
# suite (mongodb-memory-server, no external services required), and a type-check gate on
# web-app/mobile-app, which have no test suite yet but do have a real TypeScript compiler that
# catches a large class of the regressions this project has otherwise only caught by hand.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  # The AI engine had no CI job at all until 2026-08-19, which is how a model trained on uniform
  # random labels, a training/serving feature skew, and 792 duplicated training rows all survived.
  # This job runs the three gates that would have caught them: the exact-oracle verification, the
  # data/serving contract tests, and the out-of-sample evaluation with its Brier ceiling.
  ai-engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-engine/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: pip install -r requirements-dev.txt
      # Validity gate 3: the oracle must recover known structure before it is used to judge
      # anything. Pure Node, no dependencies.
      - run: node diagnostics/oracle.test.js
      - run: python -m pytest tests/ -q
      # Fails the build if Brier regresses past the ceiling recorded in the script.
      - run: python evaluate_win_probability.py

  web-app-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  mobile-app-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Rules-of-Hooks order check. tsc cannot see a hook placed after an early return, and that
      # defect crashes the whole screen at runtime - it shipped once in MatchDetailScreen.
      - run: node scripts/check-hook-order.js
      # Navigation reachability. React Navigation answers an unknown route with a console warning
      # and a no-op, so a broken link is invisible in CI, typecheck and the bundle - the control
      # just does nothing.
      - run: node scripts/check-nav-targets.js
